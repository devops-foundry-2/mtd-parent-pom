# ============================================================
# Parent POM Publish Workflow (GitHub Actions)
# ------------------------------------------------------------
# GitHub counterpart of mule-parent-pom/azure-pipelines.yml (the Azure "parent-pom-build" pipeline).
# Validates the parent POM on every PR to main and publishes it (`mvn deploy`) on main.
#
# Committed to the client mule-parent-pom repo as .github/workflows/parent-pom-build.yml by the
# foundry (Gate 1). Push/PR runs start once Gate 4 sets the repository variable FOUNDRY_CI_ENABLED=true
# (the GitHub analogue of registering the Azure pipeline); a manual run (workflow_dispatch) always works.
#
# ARTIFACT STORE: the publish target is the POM's <distributionManagement> (GitHub Packages or the
#   Anypoint Exchange Maven facade). Under Exchange the foundry sets VALIDATE_WITH_DEPLOY_PROFILE to
#   'false' so PR validation never runs the Exchange pre-deploy goal (bound to `validate`).
# CREDENTIAL: settings.xml comes from the secret MAVEN_SETTINGS_XML (base64; the Azure Secure File).
# ============================================================
name: parent-pom-build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: parent-pom-build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Comma-separated Maven profiles to activate during deploy.
  DEPLOY_PROFILES: deploy-to-exchange-v3
  VALIDATE_WITH_DEPLOY_PROFILE: 'true'

jobs:
  build:
    name: Build & publish parent POM
    if: github.event_name == 'workflow_dispatch' || vars.FOUNDRY_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # mule-maven-plugin 4.x needs Maven <= 3.9.4 (newer resolvers dropped DefaultMirrorSelector.add()).
      - name: Use Maven ${{ vars.MDF_MAVEN_VERSION || '3.9.4' }}
        env:
          MDF_MVN_VERSION: ${{ vars.MDF_MAVEN_VERSION || '3.9.4' }}
        run: |
          set -euo pipefail
          [[ "$MDF_MVN_VERSION" =~ ^3\.[0-9]+\.[0-9]+$ ]] || { echo "::error::MDF_MAVEN_VERSION '$MDF_MVN_VERSION' is not a Maven 3.x.y version."; exit 1; }
          current="$(mvn --version 2>/dev/null | sed -nE 's/^Apache Maven ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n1)" || current=""
          if [[ "$current" == "$MDF_MVN_VERSION" ]]; then
            echo "Maven $MDF_MVN_VERSION already installed — skipping download."
            exit 0
          fi
          dir="$RUNNER_TEMP/apache-maven-$MDF_MVN_VERSION"
          if [[ ! -x "$dir/bin/mvn" ]]; then
            echo "Installing Maven $MDF_MVN_VERSION (runner has ${current:-none})..."
            url="https://archive.apache.org/dist/maven/maven-3/$MDF_MVN_VERSION/binaries/apache-maven-$MDF_MVN_VERSION-bin.tar.gz"
            tgz="$RUNNER_TEMP/apache-maven-$MDF_MVN_VERSION-bin.tar.gz"
            curl -fsSL --retry 3 -o "$tgz" "$url"
            want="$(curl -fsSL --retry 3 "$url.sha512" | awk '{print $1}')"
            if command -v sha512sum >/dev/null 2>&1; then got="$(sha512sum "$tgz" | awk '{print $1}')"; else got="$(shasum -a 512 "$tgz" | awk '{print $1}')"; fi
            [[ -n "$want" && "$got" == "$want" ]] || { echo "::error::Maven $MDF_MVN_VERSION download failed its SHA-512 check."; exit 1; }
            tar -xzf "$tgz" -C "$RUNNER_TEMP"
            rm -f "$tgz"
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"
          echo "Installed Maven $MDF_MVN_VERSION at $dir/bin/mvn"

      - name: Download Maven settings.xml
        env:
          SETTINGS_B64: ${{ secrets.MAVEN_SETTINGS_XML }}
        run: |
          set -euo pipefail
          if [[ -z "$SETTINGS_B64" || "$SETTINGS_B64" == "__FILL_ME__" ]]; then
            echo "::error::MAVEN_SETTINGS_XML is empty or still __FILL_ME__ — upload the base64 settings.xml first."
            exit 1
          fi
          dir="$RUNNER_TEMP/mdf-secure-files"; mkdir -p "$dir"; chmod 700 "$dir"; umask 077
          printf '%s' "$SETTINGS_B64" | base64 -d > "$dir/settings.xml"
          # Refuse a settings.xml of another control plane, organization or repository host.
          # Never print its content, hosts or names: the job log is visible to everyone with read access.
          f="$dir/settings.xml"
          fix="Re-upload MAVEN_SETTINGS_XML with the clean GitHub-only settings.xml generated during onboarding."
          if grep -qiE 'dev\.azure\.com|visualstudio\.com|azure-artifacts|Azure Artifacts|Azure FEED PAT|ADO SECURE FILE|Pipelines -> Library|DownloadSecureFile|SYSTEM_ACCESSTOKEN|System\.AccessToken|ONBOARDING_PAT' "$f"; then
            echo "::error::MAVEN_SETTINGS_XML holds Azure DevOps content (Azure Artifacts feeds, server ids or ADO instructions). $fix"
            exit 1
          fi
          gh_host="$(printf '%s' "${GITHUB_SERVER_URL:-https://github.com}" | sed -E 's#^https?://##; s#/.*$##' | tr '[:upper:]' '[:lower:]')"
          while IFS= read -r host; do
            case "$host" in
              maven.pkg.github.com|repository.mulesoft.org|repository-master.mulesoft.org|repo1.maven.org|repo.maven.apache.org|maven.anypoint.mulesoft.com|*.anypoint.mulesoft.com|"$gh_host"|"maven.$gh_host") ;;
              *)
                echo "::error::MAVEN_SETTINGS_XML has a repository outside GitHub Packages, MuleSoft, Maven Central and Anypoint Exchange. $fix"
                exit 1 ;;
            esac
          done < <(grep -oiE '<url>[^<]*</url>' "$f" | sed -E 's#<[^>]*>##g; s#^[[:space:]]*[A-Za-z]+://##; s#^[^/@]*@##; s#[/:?].*$##' | tr '[:upper:]' '[:lower:]')
          if grep -oiE '(maven\.pkg\.github\.com|/_registry/maven)/[A-Za-z0-9_.-]+' "$f" | sed -E 's#.*/##' | grep -vixF "$GITHUB_REPOSITORY_OWNER" >/dev/null; then
            echo "::error::MAVEN_SETTINGS_XML points at GitHub Packages of another organization. $fix"
            exit 1
          fi
          echo "MAVEN_SETTINGS_PATH=$dir/settings.xml" >> "$GITHUB_ENV"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
            maven-

      - name: Pre-validate Maven configuration
        run: |
          set -euo pipefail
          profile=()
          [[ "$VALIDATE_WITH_DEPLOY_PROFILE" == "true" ]] && profile=(-P "$DEPLOY_PROFILES")
          mvn --batch-mode --no-transfer-progress -s "$MAVEN_SETTINGS_PATH" \
            clean validate ${profile[@]+"${profile[@]}"} -DskipTests -DskipMunitTests=true
          mvn --batch-mode --no-transfer-progress -s "$MAVEN_SETTINGS_PATH" \
            help:effective-pom -Doutput=target/effective-pom.xml

      # Deploy only when the run is for the real main branch (not PR validation).
      # GitHub Packages: setup-java's ~/.m2/settings.xml carries the `github` server wired to GITHUB_TOKEN.
      # A custom -s replaces it (401 when the secret's PAT is missing/wrong), so the secret is passed as
      # GLOBAL settings instead: its MuleSoft EE / Exchange servers and repositories still apply, while the
      # user-level `github` server (GITHUB_TOKEN) wins for the publish. Exchange keeps -s.
      - name: Deploy parent POM
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if grep -qE 'https://maven\.pkg\.github\.com/|/_registry/maven/' pom.xml; then
            settings=(-gs "$MAVEN_SETTINGS_PATH")
          else
            settings=(-s "$MAVEN_SETTINGS_PATH")
          fi
          mvn --batch-mode --no-transfer-progress "${settings[@]}" \
            clean deploy -P "$DEPLOY_PROFILES" -DskipTests -DskipMunitTests=true

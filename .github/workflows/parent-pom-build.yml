# ============================================================
# Parent POM Publish Workflow (GitHub Actions)
# ------------------------------------------------------------
# Validates the parent POM on every PR to main and publishes it (`mvn deploy`) on main.
#
# CREDENTIAL MODEL (no filled settings.xml ever stored as a secret):
#   settings.xml is GENERATED INLINE at runtime by the setup-maven-settings composite action
#   (in devops-foundry-2/mule-cicd-workflows), from these ORG-level secrets:
#     - GITHUB_TOKEN                      (auto-injected — GitHub Packages publish)
#     - MULESOFT_EE_USERNAME              (optional — EE repo access)
#     - MULESOFT_EE_PASSWORD              (optional)
#     - ANYPOINT_EXCHANGE_CLIENT_SECRET   (required for Exchange publish only)
#
# Run gating: push/PR runs start once org variable FOUNDRY_CI_ENABLED is 'true'. A manual
# workflow_dispatch always works.
# ============================================================
name: parent-pom-build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: parent-pom-build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Maven profiles activated during deploy — Exchange publish lives in deploy-to-exchange-v3.
  DEPLOY_PROFILES: deploy-to-exchange-v3
  # PR validation skips the Exchange pre-deploy goal to avoid spurious Anypoint auth hits.
  VALIDATE_WITH_DEPLOY_PROFILE: 'false'
  # Templates repo is where the setup-maven-settings composite action lives.
  TEMPLATES_REPOSITORY: ${{ github.repository_owner }}/mule-cicd-workflows
  TEMPLATES_REF: main

jobs:
  build:
    name: Build & publish parent POM
    if: github.event_name == 'workflow_dispatch' || vars.FOUNDRY_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pipeline templates
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEMPLATES_REPOSITORY }}
          ref: ${{ env.TEMPLATES_REF }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .mdf-templates
          persist-credentials: false

      - name: Setup Java, Maven, and settings.xml (inline from org secrets)
        uses: ./.mdf-templates/.github/actions/setup-maven-settings
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mulesoft-ee-username: ${{ secrets.MULESOFT_EE_USERNAME }}
          mulesoft-ee-password: ${{ secrets.MULESOFT_EE_PASSWORD }}
          anypoint-exchange-client-secret: ${{ secrets.ANYPOINT_EXCHANGE_CLIENT_SECRET }}
          cache-key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          cache-restore-keys: |
            maven-${{ runner.os }}-
            maven-

      - name: Pre-validate Maven configuration
        run: |
          set -euo pipefail
          profile=()
          [[ "$VALIDATE_WITH_DEPLOY_PROFILE" == "true" ]] && profile=(-P "$DEPLOY_PROFILES")
          mvn --batch-mode --no-transfer-progress -s "$MDF_SETTINGS_XML" \
            clean validate ${profile[@]+"${profile[@]}"} -DskipTests -DskipMunitTests=true
          mvn --batch-mode --no-transfer-progress -s "$MDF_SETTINGS_XML" \
            help:effective-pom -Doutput=target/effective-pom.xml

      # Deploy only on main (not PR).
      # GitHub Packages publish uses the generated settings.xml which already carries the
      # `github` server bound to GITHUB_TOKEN.
      - name: Deploy parent POM
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only activate Exchange publish if the Exchange secret is actually set — otherwise
          # Maven would fail at the exchange-pre-deploy goal.
          if [[ -n "${{ secrets.ANYPOINT_EXCHANGE_CLIENT_SECRET }}" ]]; then
            profiles="-P $DEPLOY_PROFILES"
          else
            echo "::notice::ANYPOINT_EXCHANGE_CLIENT_SECRET is not set — skipping Exchange publish. GitHub Packages publish still runs."
            profiles=""
          fi
          mvn --batch-mode --no-transfer-progress -s "$MDF_SETTINGS_XML" \
            clean deploy $profiles -DskipTests -DskipMunitTests=true
